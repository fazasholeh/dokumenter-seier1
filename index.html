<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery Estetik</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: 'Inter', sans-serif; }
        .swiper { width: 100%; height: 300px; padding: 20px 0; }
        .swiper-slide { 
            background-position: center; background-size: cover; 
            width: 300px; height: 100%; border-radius: 15px; 
            overflow: hidden; transition: transform 0.3s;
        }
        .swiper-slide:hover { transform: scale(1.05); }
        .swiper-slide img, .swiper-slide video { width: 100%; height: 100%; object-fit: cover; }
        h2 { margin-left: 5%; font-weight: 300; letter-spacing: 2px; text-transform: uppercase; }
    </style>
</head>
<body class="py-10">

    <header class="text-center mb-16">
        <h1 class="text-5xl font-bold mb-2">VISUAL ARCHIVE</h1>
        <p class="text-gray-400">Koleksi Estetik Foto & Video</p>
    </header>

    <main class="space-y-12">
        
        <section>
            <h2 class="text-xl mb-4">01. Photography - Nature</h2>
            <div class="swiper mySwiper">
                <div class="swiper-wrapper">
                    <div class="swiper-slide"><img src="https://picsum.photos/400/600?random=1" alt="Foto"></div>
                    <div class="swiper-slide"><img src="https://picsum.photos/400/600?random=2" alt="Foto"></div>
                    <div class="swiper-slide"><img src="https://picsum.photos/400/600?random=3" alt="Foto"></div>
                    <div class="swiper-slide"><img src="https://picsum.photos/400/600?random=4" alt="Foto"></div>
                </div>
            </div>
        </section>

        <section>
            <h2 class="text-xl mb-4">02. Cinematic Motion</h2>
            <div class="swiper mySwiper">
                <div class="swiper-wrapper">
                    <div class="swiper-slide">
                        <video src="https://www.w3schools.com/html/mov_bbb.mp4" controls muted loop></video>
                    </div>
                    <div class="swiper-slide">
                        <video src="https://www.w3schools.com/html/movie.mp4" controls muted loop></video>
                    </div>
                    </div>
            </div>
        </section>

        </main>

    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script>
        var swiper = new Swiper(".mySwiper", {
            slidesPerView: "auto",
            spaceBetween: 30,
            centeredSlides: true,
            grabCursor: true,
            loop: true,
            autoplay: { delay: 2500, disableOnInteraction: false },
        });
    </script>
</body>
</html>
